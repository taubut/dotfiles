# Wallust generated Vicinae theme

[meta]
version = 1
name = "Wallust"
description = "Dynamic colors from wallpaper"
variant = "dark"

[colors.core]
background = "#10131A"
foreground = "#D8C58C"
secondary_background = "#02042B"
border = "#877846"
accent = "#A18B92"

[colors.accents]
blue = "#A18B92"
green = "#984F3A"
magenta = "#A26343"
orange = "#7F8B64"
purple = "#A26343"
red = "#868F7C"
yellow = "#7F8B64"
cyan = "#91814E"

[colors.list.item.selection]
background = { name = "#A18B92", opacity = 0.3 }
secondary_background = "#877846"
foreground = "#A18B92"

[colors.list.item.hover]
background = { name = "#A18B92", opacity = 0.15 }
