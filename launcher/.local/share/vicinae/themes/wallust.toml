# Wallust generated Vicinae theme

[meta]
version = 1
name = "Wallust"
description = "Dynamic colors from wallpaper"
variant = "dark"

[colors.core]
background = "#13111A"
foreground = "#B1A1A6"
secondary_background = "#39333C"
border = "#695B60"
accent = "#3E3C2A"

[colors.accents]
blue = "#3E3C2A"
green = "#4C2919"
magenta = "#948976"
orange = "#B39B4F"
purple = "#948976"
red = "#CA8879"
yellow = "#B39B4F"
cyan = "#493D41"

[colors.list.item.selection]
background = { name = "#3E3C2A", opacity = 0.3 }
secondary_background = "#695B60"
foreground = "#3E3C2A"

[colors.list.item.hover]
background = { name = "#3E3C2A", opacity = 0.15 }
