[Service]
Environment=PIPEWIRE_NODE=pipeweaver_game
# Wait (up to 30s) for the Beacn/PipeWeaver "pipeweaver_game" node to appear
# before starting, so FluidSynth autoconnects to the Game dial instead of the
# dead BEACN Mix Create "mono-fallback" sink. Fixes the boot-order race where
# fluidsynth starts before beacn-utility has created the virtual nodes.
ExecStartPre=/bin/sh -c 'for i in $(seq 1 30); do /usr/bin/pw-cli ls Node 2>/dev/null | grep -q pipeweaver_game && exit 0; sleep 1; done; exit 0'
